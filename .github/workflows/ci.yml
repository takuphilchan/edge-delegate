name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Build installable packages
        run: python -m pip wheel --no-deps . ./examples/plugins/counter --wheel-dir dist
      - name: Verify installed wheels outside the checkout
        run: python scripts/check_wheel.py --wheel dist/edge_delegate-*.whl --extension-wheel dist/edge_delegate_counter_example-*.whl
