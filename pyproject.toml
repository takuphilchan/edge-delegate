[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-delegate"
version = "0.3.0"
description = "Model-independent edge request planner and delegation runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
edge-delegate = "edge_delegate.cli:main"
edge-delegate-lab = "edge_delegate_lab.cli:main"
edge-delegate-device = "edge_delegate.simulator.server:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "jsonschema>=4.26,<5",
  "pytest>=9.1,<10",
  "ruff>=0.16.5,<0.17",
]
planner = [
  "accelerate>=1.14,<2",
  "peft>=0.20,<0.21",
  "psutil>=7.2,<8",
  "torch>=2.13,<3",
  "transformers>=5.16,<6",
]
inference = [
  "accelerate>=1.14,<2",
  "peft>=0.20,<0.21",
  "psutil>=7.2,<8",
  "torch>=2.13,<3",
  "transformers>=5.16,<6",
]
training = [
  "accelerate>=1.14,<2",
  "datasets>=5.0,<6",
  "peft>=0.20,<0.21",
  "psutil>=7.2,<8",
  "pyyaml>=6.0,<7",
  "tensorboard>=2.21,<3",
  "torch>=2.13,<3",
  "transformers>=5.16,<6",
  "trl>=1.12,<2",
]

[project.entry-points."edge_delegate.model_plugins.v1"]
bounded-commands = "edge_delegate.model_plugins.bounded_commands:plugin"
functiongemma = "edge_delegate.model_plugins.functiongemma:plugin"
functiongemma-tasks = "edge_delegate.model_plugins.functiongemma_tasks:plugin"
task-classifier = "edge_delegate.model_plugins.task_classifier:plugin"

[project.entry-points."edge_delegate.device_adapters.v1"]
unix = "edge_delegate.adapters.registry:unix_adapter"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers -m 'not hardware'"
markers = [
  "hardware: tests that require or measure a declared hardware target",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
